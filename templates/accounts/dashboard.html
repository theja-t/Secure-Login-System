{% extends 'accounts/base.html' %}
{% block title %}Your account{% endblock %}
{% block content %}
<div class="form-wrap dashboard-wrap">
  <p class="eyebrow">PRIVATE SPACE</p>
  <h1>You’re signed<br><em>in, {{ user.username }}.</em></h1>
  <p class="intro">Your account session is active.</p>
  <div class="account-detail"><span>ACCOUNT</span><strong>{{ user.email|default:'Email not provided' }}</strong></div>
  <form method="post" action="{% url 'logout' %}" class="auth-form">
    {% csrf_token %}
    <button class="primary-button" type="submit">Sign out <span aria-hidden="true">↗</span></button>
  </form>
</div>
{% endblock %}
